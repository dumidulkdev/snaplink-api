services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snaplink
      POSTGRES_USER: snaplink
      POSTGRES_PASSWORD: snaplink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaplink -d snaplink"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: snaplink
      DB_USER: snaplink
      DB_PASSWORD: snaplink
      SNAPLINK_BASE_URL: http://localhost:8080
      SNAPLINK_IP_HASH_SALT: docker-compose-salt
    depends_on:
      postgres:
        condition: service_healthy