spring:
  datasource:
    url: jdbc:h2:mem:snaplink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration
  sql:
    init:
      mode: never

snaplink:
  base-url: http://localhost:8080